services:
  # ------------------------------------------------------------------
  # MariaDB 11.7 資料庫
  # ------------------------------------------------------------------
  mariadb:
    image: mariadb:11.7
    container_name: analytics-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_pw_change_me}
      MARIADB_DATABASE: ${DB_NAME:-analytics}
      MARIADB_USER: ${DB_USER:-analytics}
      MARIADB_PASSWORD: ${DB_PASSWORD:-analytics_pw_change_me}
      TZ: ${TZ:-Asia/Taipei}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=300
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "${DB_PORT:-3306}:3306"
    networks:
      - analytics-net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ------------------------------------------------------------------
  # FastAPI 後端
  # ------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: analytics-backend
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-Realtime Analytics Platform}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: ${TZ:-Asia/Taipei}
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-analytics}
      DB_USER: ${DB_USER:-analytics}
      DB_PASSWORD: ${DB_PASSWORD:-analytics_pw_change_me}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_ECHO: ${DB_ECHO:-false}
      SECRET_KEY: ${SECRET_KEY:?請於 .env 設定 SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-120}
      REFRESH_TOKEN_EXPIRE_MINUTES: ${REFRESH_TOKEN_EXPIRE_MINUTES:-10080}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:8501}
      GENERATOR_ENABLED: ${GENERATOR_ENABLED:-true}
      GENERATOR_INTERVAL_SECONDS: ${GENERATOR_INTERVAL_SECONDS:-1}
      GENERATOR_BATCH_SIZE: ${GENERATOR_BATCH_SIZE:-5}
      GENERATOR_FLUSH_INTERVAL: ${GENERATOR_FLUSH_INTERVAL:-5}
      GENERATOR_FLUSH_SIZE: ${GENERATOR_FLUSH_SIZE:-50}
      ALERT_THRESHOLD_HIGH: ${ALERT_THRESHOLD_HIGH:-90}
      ALERT_THRESHOLD_LOW: ${ALERT_THRESHOLD_LOW:-10}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@1234}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - analytics-net
    volumes:
      - backend_logs:/app/logs

  # ------------------------------------------------------------------
  # Streamlit 前端
  # ------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
    container_name: analytics-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      TZ: ${TZ:-Asia/Taipei}
      API_BASE_URL: ${API_BASE_URL:-http://backend:8000}
      WS_BASE_URL: ${WS_BASE_URL:-ws://backend:8000}
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    networks:
      - analytics-net

networks:
  analytics-net:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
  backend_logs:
    driver: local
