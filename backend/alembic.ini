[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Keep this file ASCII-only: Alembic reads it with the locale encoding,
# so non-ASCII bytes break the CLI on non-UTF-8 locales (e.g. Windows cp950).
# The connection URL is loaded from the app settings in alembic/env.py.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
